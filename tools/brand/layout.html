      <div class="group">
        <span class="label">Skabelon</span>
        <div class="tpl" role="radiogroup" aria-label="Skabelon">
          <label><input type="radio" name="layout" id="layout-center" value="center" checked><span><svg viewBox="0 0 60 30" aria-hidden="true"><rect x="17" y="2" width="26" height="26" rx="3" class="q"/><rect x="25" y="10" width="10" height="10" rx="2" class="l"/></svg><b>Kvadrat</b><i>Logo i midten</i></span></label>
          <label><input type="radio" name="layout" id="layout-wide" value="wide"><span><svg viewBox="0 0 60 30" aria-hidden="true"><rect x="4" y="4" width="22" height="22" rx="3" class="q"/><rect x="33" y="10" width="22" height="10" rx="2" class="l"/></svg><b>Bred</b><i>Logo ved siden af</i></span></label>

        <div id="sideRow" hidden>

          <input type="text" id="sideText" value="__SIDE__" spellcheck="true" autocomplete="off">

        <p class="hint">Vælg en skabelon, og tilpas den bagefter med indstillingerne herunder.</p>
      </div>
